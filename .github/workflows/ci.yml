name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: port
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "port -> target"

      - name: Build all 10 crates & 5 binaries (release, zero warnings)
        run: cargo build --workspace --all-targets --release

      - name: Run full 35-test workspace suite (release)
        run: cargo test --workspace --release

      - name: Smoke-test Launcher & Patcher CLIs against bundled reference configs
        run: |
          cargo run --release --bin pw-launcher -- ../source/pw142
          cargo run --release --bin pw-patcher -- ../source/pw142

  # PR executables: every pull request produces directly downloadable binaries.
  # Artifacts land on the PR's workflow-run page ("Artifacts" section), named
  # pw142-pr<N>-<platform>, and a bot comment on the PR lists them.
  pr-executables:
    name: PR Executables (${{ matrix.platform }})
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive_ext: .tar.gz
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive_ext: .zip
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "port -> target"
          key: pr-${{ matrix.target }}

      - name: Compile all 5 binaries (release, LTO, stripped)
        working-directory: port
        run: |
          cargo build --release --target "${{ matrix.target }}" \
            --bin pw-elementclient \
            --bin pw-elementlocalize \
            --bin pw-launcher \
            --bin pw-patcher \
            --bin pw-data-versions

      - name: Smoke-run the client CLI headless (--check --offline)
        if: matrix.platform == 'linux-x86_64'
        working-directory: port
        run: ./target/${{ matrix.target }}/release/pw-elementclient --help

      - name: Package direct executables + checksum
        run: |
          set -euo pipefail
          EXT="${{ matrix.ext }}"
          TARGET_BIN_DIR="port/target/${{ matrix.target }}/release"
          PKG="pw142-pr${{ github.event.pull_request.number }}-${{ matrix.platform }}"
          mkdir -p "dist/${PKG}/element/data"
          cp "${TARGET_BIN_DIR}/pw-launcher${EXT}"        "dist/${PKG}/pw-launcher${EXT}"
          cp "${TARGET_BIN_DIR}/pw-patcher${EXT}"         "dist/${PKG}/pw-patcher${EXT}"
          cp "${TARGET_BIN_DIR}/pw-elementclient${EXT}"   "dist/${PKG}/element/pw-elementclient${EXT}"
          cp "${TARGET_BIN_DIR}/pw-elementlocalize${EXT}" "dist/${PKG}/element/pw-elementlocalize${EXT}"
          cp "${TARGET_BIN_DIR}/pw-data-versions${EXT}"   "dist/${PKG}/element/data/pw-data-versions${EXT}"
          if [[ -z "${EXT}" ]]; then
            chmod +x dist/${PKG}/pw-launcher dist/${PKG}/pw-patcher \
              dist/${PKG}/element/pw-elementclient dist/${PKG}/element/pw-elementlocalize \
              dist/${PKG}/element/data/pw-data-versions
          fi
          pushd dist > /dev/null
          if [[ "${{ matrix.archive_ext }}" == ".zip" ]]; then
            7z a -tzip -mx=9 "${PKG}${{ matrix.archive_ext }}" "${PKG}" > /dev/null
          else
            tar -czf "${PKG}${{ matrix.archive_ext }}" "${PKG}"
          fi
          sha256sum "${PKG}${{ matrix.archive_ext }}" > "${PKG}${{ matrix.archive_ext }}.sha256"
          popd > /dev/null
          ls -lh dist/

      - name: Upload PR executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pw142-pr${{ github.event.pull_request.number }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  pr-artifact-comment:
    name: Comment artifact links on the PR
    needs: pr-executables
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post artifact summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `### 🧰 PR executables built`,
              ``,
              `Download the ready-to-run binaries from the **Artifacts** section of this run: ${runUrl}`,
              ``,
              `| Artifact | Contents |`,
              `|---|---|`,
              `| \`pw142-pr${pr}-linux-x86_64\` | tar.gz with \`pw-elementclient\`, \`pw-elementlocalize\`, \`pw-launcher\`, \`pw-patcher\`, \`pw-data-versions\` (Linux x64, LTO, stripped) + sha256 |`,
              `| \`pw142-pr${pr}-windows-x86_64\` | zip with the same 5 \`.exe\` binaries (Windows x64, LTO, stripped) + sha256 |`,
              ``,
              `Quick start: extract, drop your PW 1.4.2 \`.pck\` files into \`element/\`, then run \`./element/pw-elementclient startbypatcher\` (offline sandbox) or \`--connect host:29000 --user U --pass P\` for a live server.`,
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });
