name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: port
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build all libraries & binaries (release)
        run: cargo build --workspace --all-targets --release

      - name: Run full workspace test suite (release)
        run: cargo test --workspace --release

      - name: Smoke-test Launcher & Patcher CLIs against bundled reference configs
        run: |
          cargo run --release --bin pw-launcher -- ../source/pw142
          cargo run --release --bin pw-patcher -- ../source/pw142
